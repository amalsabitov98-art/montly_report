name: Apply fullscreen report fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/report-improvements-08v7zq
          fetch-depth: 0
      - name: Make every slide fill the viewport
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")

          replacements = [
            (
              '.siteShell{position:fixed;left:50%;top:50%;width:1440px;height:900px;background:var(--bg);overflow:hidden;transform-origin:50% 50%}',
              '.siteShell{position:fixed;inset:0;width:100vw;height:100vh;background:var(--bg);overflow:hidden}'
            ),
            (
              'background:linear-gradient(90deg,rgba(2,10,19,.34),rgba(2,10,19,.08) 24%,rgba(2,10,19,.08) 76%,rgba(2,10,19,.34))',
              'background:linear-gradient(90deg,rgba(2,10,19,.16),rgba(2,10,19,.03) 24%,rgba(2,10,19,.03) 76%,rgba(2,10,19,.16))'
            ),
            ('object-fit:contain;object-position:center;z-index:2', 'object-fit:fill;object-position:center;z-index:2'),
            ('.workspace{height:calc(900px - 82px)', '.workspace{height:calc(100vh - 82px)'),
          ]

          for old, new in replacements:
            if old not in html:
              raise SystemExit(f"Expected source fragment not found: {old[:80]}")
            html = html.replace(old, new, 1)

          html, count = re.subn(
            r"\n  const STAGE_W=1440, STAGE_H=900;\n  const stage=document\.querySelector\('\.siteShell'\);\n  function fitStage\(\)\{\n    const s=Math\.min\(window\.innerWidth/STAGE_W, window\.innerHeight/STAGE_H\);\n    stage\.style\.transform='translate\(-50%,-50%\) scale\('\+s\+'\)';\n  \}\n  window\.addEventListener\('resize',fitStage\);\n  window\.addEventListener\('orientationchange',fitStage\);\n  fitStage\(\);",
            "",
            html,
            count=1,
          )
          if count != 1:
            raise SystemExit("Fixed-stage scaling block not found")

          path.write_text(html, encoding="utf-8")
      - name: Commit and publish
        run: |
          git config user.name "Codex"
          git config user.email "codex@openai.com"
          git add index.html
          git commit -m "Fill report slides to viewport"
          git push origin HEAD:claude/report-improvements-08v7zq
